*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:13px Consolas,monospace;overflow:hidden}button,input,select{font:inherit;color:inherit;background:#242930;border:1px solid var(--l);border-radius:4px;padding:6px}button{cursor:pointer}button.active{border-color:var(--a);background:#44381f}.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;gap:6px;align-items:center;padding:7px;background:#13161a;border-bottom:1px solid var(--l);flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.08em;margin-right:8px}.grow{flex:1}.work{min-height:0;display:grid;grid-template-columns:265px 1fr 270px}.side{overflow:auto;background:var(--p)}.left{border-right:1px solid var(--l)}.right{border-left:1px solid var(--l)}.sec{padding:9px;border-bottom:1px solid var(--l)}h3{margin:0 0 7px;font-size:11px;letter-spacing:.08em;color:#cfc8b8}.tools{display:grid;grid-template-columns:1fr 1fr;gap:5px}.center{position:relative;min-width:0;min-height:0}.view{position:absolute;inset:0}.hidden{display:none!important}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;top:9px;left:9px;background:#11151ddd;border:1px solid var(--l);padding:5px 7px;border-radius:4px;pointer-events:none}.status{padding:5px 9px;border-top:1px solid var(--l);color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;gap:5px;align-items:center}.list{display:flex;flex-direction:column;gap:4px}.item{display:flex;gap:4px}.item button:first-child{flex:1;text-align:left}.asset{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:4px;border:1px solid transparent;border-radius:4px;cursor:pointer}.asset:hover{background:var(--p2)}.asset.sel{border-color:var(--a);background:#2d281c}.thumb{width:40px;height:40px;background:#0b0d10;border:1px solid #30353d;display:grid;place-items:center;color:var(--m);font-size:10px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.name,.path{overflow:hidden;text-overf </head><body><div class="app">
<div class="top"><div class="brand">DEPTHWORKS // LEVEL EDITOR</div><button id="b2" class="active">2D EDIT</button><button id="b3">3D PREVIEW</button><button id="new">NEW</button><button id="addChunk">+ CHUNK</button><button id="addLayer">+ LAYER</button><button id="import">IMPORT</button><button id="export">EXPORT</button><input id="file" type="file" accept=".json,application/json" hidden><span class="grow"></span><span id="count" class="hint">ASSETS …</span></div>

<aside class="side right"><div class="sec"><h3>SELECTION</h3><div id="sel" class="hint">Nothing selected.</div></div><div class="sec"><h3>ASSET PREVIEW</h3><div id="preview" class="hint">Select an asset.</div></div><div class="sec"><h3>PROJECT</h3><div class="field"><label>Name</label><input id="pname" value="Depthworks Blockout"></div><label class="hint"><input id="ghost" type="checkbox" checked> ghost other layers</label><br><label class="hint"><input id="grid" type="checkbox" checked> draw grid</label></div></aside>
</div><div id="status" class="status">Starting editor…</div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const $=s=>document.querySelector(s),T=24,ctx=$('#map').getContext('2d'),uid=()=>Math.random().toString(36).slice(2,9);
const rows=c=>Array.from({length:T},()=>c.repeat(T));
const S={p:null,c:null,l:null,tool:'floor',asset:null,assets:[],sel:null,pan:{x:70,y:60},zoom:21,drag:false,last:null,three:null};
function chunk(name='Pump Annex',gx=0,gy=0,n=8){const l={id:uid(),name:'Ground',z:0,thickness:0,rows:rows('.')};return{id:uid(),number:n,name,gx,gy,layers:[l],objects:[]}}
function reset(){const c=chunk();S.p={version:1,name:'Depthworks Blockout',chunks:[c]};S.c=c.id;S.l=c.layers[0].id;S.sel=null;$('#pname').value=S.p.name;render();stat('New project.','ok')}
function C(){return S.p.chunks.find(x=>x.id===S.c)} function L(){return C().layers.find(x=>x.id===S.l)||C().layers[0]}
function stat(x,k=''){const e=$('#status');e.textContent=x;e.className='status '+k}
function renderLists(){const ce=$('#chunks');ce.innerHTML='';S.p.chunks.forEach(c=>{const r=document.createElement('div');r.className='item';const b=document.createElement('button');b.textContent=c.number+' '+c.name;b.className=c.id===S.c?'active':'';b.onclick=()=>{S.c=c.id;S.l=c.layers[0].id;render()};r.append(b);ce.append(r)});const le=$('#layers');le.innerHTML='';C().layers.slice().sort((a,b)=>b.z-a.z).forEach(l=>{const b=document.createElement('button');b.textContent=l.name+'  Z '+l.z;b.className=l.id===S.l?'active':'';b.onclick=()=>{S.l=l.id;render()};le.append(b)})}
function resize(){const c=$('#map'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);draw();if(S.three){const q=$('#three').getBoundingClientRect();S.three.r.setSize(q.width,q.height,false);S.three.cam.aspect=q.width/Math.max(1,q.height);S.three.cam.updateProjectionMatrix()}}
function w2s(x,y){return{x:S.pan.x+x*S.zoom,y:S.pan.y+y*S.zoom}} function s2w(x,y){return{x:(x-S.pan.x)/S.zoom,y:(y-S.pan.y)/S.zoom}}
function origin(c){return{x:c.gx*T,y:c.gy*T}}
function hit(wx,wy){for(const c of S.p.chunks){const o=origin(c),x=Math.floor(wx-o.x),y=Math.floor(wy-o.y);if(x>=0&&x<T&&y>=0&&y<T)return{c,o,x,y}}}
function draw(){const c=$('#map'),r=c.getBoundingClientRect();ctx.fillStyle='#0b0d10';ctx.fillRect(0,0,r.width,r.height);for(const ch of S.p.chunks){const o=origin(ch);for(const l of ch.layers){const on=ch.id===S.c&&l.id===S.l;if(!on&&!$('#ghost').checked)continue;ctx.globalAlpha=on?1:.22;for(let y=0;y<T;y++)for(let x=0;x<T;x++){const q=l.rows[y][x],p=w2s(o.x+x,o.y+y);ctx.fillStyle=q==='#'?'#555b64':q==='='?'#79643b':q==='_'?'#090a0c':'#25292f';ctx.fillRect(p.x,p.y,S.zoom+.3,S.zoom+.3)}}ctx.globalAlpha=1;const a=w2s(o.x,o.y),b=w2s(o.x+T,o.y+T);ctx.strokeStyle=ch.id===S.c?'#d6a34e':'#666b73';ctx.lineWidth=ch.id===S.c?2:1;ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.fillStyle='#eee8da';ctx.fillText(ch.number+' '+ch.name,a.x+4,a.y-7);if($('#grid').checked&&S.zoom>8){ctx.strokeStyle='#ffffff18';ctx.lineWidth=1;for(let i=0;i<=T;i++){let p=w2s(o.x+i,o.y);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y+T*S.zoom);ctx.stroke();p=w2s(o.x,o.y+i);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+T*S.zoom,p.y);ctx.stroke()}}for(const ob of ch.objects){if(ob.layerId!==S.l&&!$('#ghost').checked)continue;const p=w2s(o.x+ob.x,o.y+ob.y);ctx.globalAlpha=ob.layerId===S.l?1:.25;ctx.fillStyle=ob.type==='light'?'#efd673':ob.type==='door'?'#69a5bd':ob.type==='hazard'?'#c76b58':ob.type==='asset'?'#a786bf':'#86aa86';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(4,S.zoom*.3),0,7);ctx.fill();if(S.sel===ob.id){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}ctx.globalAlpha=1}}$('#o2').textContent='2D • '+S.tool.toUpperCase()+' • '+Math.round(S.zoom)+' px/m'}
function tile(l,x,y,v){const r=l.rows[y];l.rows[y]=r.slice(0,x)+v+r.slice(x+1)}
function addObj(h,wx,wy){const l=h.c.layers.find(x=>x.id===S.l)||h.c.layers[0],x=Math.floor(wx-h.o.x)+.5,y=Math.floor(wy-h.o.y)+.5;let o={id:uid(),layerId:l.id,type:S.tool,x,y,z:l.z};if(S.tool==='box')Object.assign(o,{w:2,d:2,h:2,rotation:0});else if(S.tool==='stairs')Object.assign(o,{w:2,d:4,h:3,steps:15,rotation:0});else if(S.tool==='door')Object.assign(o,{w:2,d:.2,h:2.5,rotation:0});else if(S.tool==='light')Object.assign(o,{z:l.z+2.4,intensity:1,radius:5});else if(S.tool==='hazard')Object.assign(o,{w:2,d:2,h:1,kind:'Electricity'});else if(S.tool==='terminal')Object.assign(o,{title:'TERMINAL',rotation:0});else if(S.tool==='spawn')o.spawnKind='Player';else if(S.tool==='asset'&&S.asset)Object.assign(o,{path:S.asset.path,url:S.asset.url,ext:S.asset.ext,name:S.asset.name,scale:1,rotation:0});else return;h.c.objects.push(o);S.sel=o.id;render();build3d()}
const map=$('#map');map.oncontextmenu=e=>e.preventDefault();map.onpointerdown=e=>{map.setPointerCapture(e.pointerId);S.last={x:e.offsetX,y:e.offsetY};if(e.button===2){S.drag=true;return}const w=s2w(e.offsetX,e.offsetY),h=hit(w.x,w.y);if(S.tool==='select'){S.sel=null;if(h){let d=.7;for(const o of h.c.objects){const q=Math.hypot(h.o.x+o.x-w.x,h.o.y+o.y-w.y);if(q<d){d=q;S.sel=o.id}}}render();return}if(!h)return;if(['floor','wall','void','deck'].includes(S.tool)){tile(h.c.layers.find(x=>x.id===S.l)||h.c.layers[0],h.x,h.y,S.tool==='floor'?'.':S.tool==='wall'?'#':S.tool==='deck'?'=':'_');S.paint=true;render()}else addObj(h,w.x,w.y)};
map.onpointermove=e=>{if(S.drag){S.pan.x+=e.offsetX-S.last.x;S.pan.y+=e.offsetY-S.last.y;S.last={x:e.offsetX,y:e.offsetY};draw();return}if(S.paint){const w=s2w(e.offsetX,e.offsetY),h=hit(w.x,w.y);if(h){tile(h.c.layers.find(x=>x.id===S.l)||h.c.layers[0],h.x,h.y,S.tool==='floor'?'.':S.tool==='wall'?'#':S.tool==='deck'?'=':'_');draw()}}};map.onpointerup=()=>{S.drag=S.paint=false;S.last=null;build3d()};map.onwheel=e=>{e.preventDefault();const w=s2w(e.offsetX,e.offsetY);S.zoom=Math.max(5,Math.min(64,S.zoom*Math.exp(-e.deltaY*.001)));const p=w2s(w.x,w.y);S.pan.x+=e.offsetX-p.x;S.pan.y+=e.offsetY-p.y;draw()};
function renderSel(){const e=$('#sel'),c=C(),o=S.p.chunks.flatMap(x=>x.objects).find(x=>x.id===S.sel);if(!o){e.innerHTML='<span class="hint">Nothing selected.</span>';return}const props=['x','y','z','rotation','w','d','h','scale','intensity','radius','steps'].filter(k=>o[k]!=null);e.innerHTML='<b>'+o.type.toUpperCase()+'</b>'+(o.name?'<div class="path">'+o.name+'</div>':'')+props.map(k=>'<div class="field"><label>'+k+'</label><input data-k="'+k+'" type="number" step=".1" value="'+o[k]+'"></div>').join('')+'<button id="del" style="width:100%">DELETE</button>';e.querySelectorAll('input').forEach(i=>i.onchange=()=>{const n=Number(i.value);if(Number.isFinite(n)){o[i.dataset.k]=n;render();build3d()}});$('#del').onclick=()=>{for(const q of S.p.chunks)q.objects=q.objects.filter(x=>x.id!==o.id);S.sel=null;render();build3d()}}
function render(){renderLists();renderSel();draw()}
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>{S.tool=b.dataset.t;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('active',x===b));draw()});
$('#addChunk').onclick=()=>{const n=Math.max(...S.p.chunks.map(x=>x.number))+1,gx=Math.max(...S.p.chunks.map(x=>x.gx))+1,c=chunk('Chunk '+n,gx,0,n);S.p.chunks.push(c);S.c=c.id;S.l=c.layers[0].id;render();build3d()};
$('#addLayer').onclick=()=>{const z=Number(prompt('Layer Z in metres','3'));if(!Number.isFinite(z))return;const l={id:uid(),name:prompt('Layer name','Deck '+z)||'Deck '+z,z,thickness:.3,rows:rows('_')};C().layers.push(l);S.l=l.id;render();build3d()};
$('#new').onclick=()=>confirm('Discard editor project?')&&reset();$('#pname').onchange=e=>S.p.name=e.target.value||'Depthworks Blockout';$('#ghost').onchange=draw;$('#grid').onchange=draw;
$('#export').onclick=()=>{S.p.name=$('#pname').value||S.p.name;const b=new Blob([JSON.stringify(S.p,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='depthworks-level.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const p=JSON.parse(await e.target.files[0].text());if(!Array.isArray(p.chunks))throw Error('missing chunks');S.p=p;S.c=p.chunks[0].id;S.l=p.chunks[0].layers[0].id;S.sel=null;$('#pname').value=p.name||'';render();build3d();stat('Imported project.','ok')}catch(x){stat('Import failed: '+x.message,'bad')}e.target.value=''};
async function assets(){try{const j=await (await fetch('/__depthworks_assets.json',{cache:'no-store'})).json();S.assets=j.items;$('#count').textContent=j.count+' ASSETS';renderAssets();stat('Loaded '+j.count+' assets from src/assets.','ok')}catch(e){stat('Asset scan failed: '+e.message,'bad')}}
function renderAssets(){const q=$('#search').value.toLowerCase(),f=$('#filter').value,e=$('#assets');e.innerHTML='';S.assets.filter(a=>(f==='all'||a.kind===f)&&a.path.toLowerCase().includes(q)).slice(0,400).forEach(a=>{const d=document.createElement('div');d.className='asset'+(S.asset?.path===a.path?' sel':'');const th=document.createElement('div');th.className='thumb';if(a.kind==='texture'&&['.png','.jpg','.jpeg','.webp','.bmp'].includes(a.ext)){const im=new Image;im.src=a.url;th.append(im)}else th.textContent=a.kind==='model'?'3D':a.kind==='audio'?'SND':'FILE';const tx=document.createElement('div');tx.innerHTML='<div class="name">'+a.name+'</div><div class="path">'+a.path.replace('src/assets/','')+'</div>';d.append(th,tx);d.onclick=()=>selectAsset(a);e.append(d)})}
function selectAsset(a){S.asset=a;renderAssets();const p=$('#preview');if(a.kind==='texture')p.innerHTML='<img class="preview" src="'+a.url+'"><div class="path">'+a.path+'</div>';else if(a.kind==='model'){p.innerHTML='<b>'+a.name+'</b><div class="path">'+a.path+'</div><div class="row" style="margin-top:6px"><button id="placeA" class="grow">PLACE</button><button id="showA" class="grow">3D PREVIEW</button></div>';$('#placeA').onclick=()=>{S.tool='asset';document.querySelectorAll('#tools button').forEach(x=>x.classList.remove('active'));stat('Click the 2D map to place '+a.name+'.','ok')};$('#showA').onclick=()=>{mode('3d');previewModel(a)}}else p.innerHTML='<b>'+a.name+'</b><div class="path">'+a.path+'</div>'}
$('#search').oninput=renderAssets;$('#filter').onchange=renderAssets;
function init3d(){if(S.three)return;const r=new THREE.WebGLRenderer({canvas:$('#three'),antialias:true});r.setPixelRatio(Math.min(2,devicePixelRatio||1));const scene=new THREE.Scene;scene.background=new THREE.Color(0x0b0d10);const cam=new THREE.PerspectiveCamera(65,1,.05,500);cam.position.set(22,20,28);const ctl=new OrbitControls(cam,$('#three'));ctl.enableDamping=true;ctl.target.set(12,0,12);scene.add(new THREE.HemisphereLight(0xcbd7e0,0x211d18,1.5));const dl=new THREE.DirectionalLight(0xffe1ad,2);dl.position.set(10,20,7);scene.add(dl);scene.add(new THREE.GridHelper(160,160,0x555b63,0x292d32));const root=new THREE.Group,preview=new THREE.Group;scene.add(root,preview);S.three={r,scene,cam,ctl,root,preview,cache:new Map};resize();(function loop(){requestAnimationFrame(loop);ctl.update();r.render(scene,cam)})()}
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.88,metalness:.08});
async function loadModel(a){if(S.three.cache.has(a.path))return S.three.cache.get(a.path).clone(true);let o;if(a.ext==='.obj')o=await new OBJLoader().loadAsync(a.url);else if(a.ext==='.fbx')o=await new FBXLoader().loadAsync(a.url);else if(a.ext==='.glb'||a.ext==='.gltf')o=(await new GLTFLoader().loadAsync(a.url)).scene;else throw Error('unsupported model');S.three.cache.set(a.path,o);return o.clone(true)}
async function addModel(o,or){try{const a=S.assets.find(x=>x.path===o.path)||o,m=await loadModel(a),b=new THREE.Box3().setFromObject(m),sz=new THREE.Vector3(),ce=new THREE.Vector3();b.getSize(sz);b.getCenter(ce);m.position.sub(ce);const s=(o.scale||1)*Math.min(1.5,1.5/Math.max(sz.x,sz.y,sz.z,.001));m.scale.setScalar(s);m.rotation.y=-(o.rotation||0);m.position.add(new THREE.Vector3(or.x+o.x,o.z+sz.y*s*.5,or.y+o.y));S.three.root.add(m)}catch(e){const m=new THREE.Mesh(new THREE.BoxGeometry(.8,.8,.8),M(0x8f719e));m.position.set(or.x+o.x,o.z+.4,or.y+o.y);S.three.root.add(m)}}
async function build3d(){if(!S.three)return;const r=S.three.root;while(r.children.length)r.remove(r.children[0]);const ps=[];for(const c of S.p.chunks){const or=origin(c);for(const l of c.layers)for(let y=0;y<T;y++)for(let x=0;x<T;x++){const q=l.rows[y][x];if(q==='_' )continue;if(q==='.'||q==='='){const m=new THREE.Mesh(new THREE.BoxGeometry(1,l.thickness||.08,1),M(q==='='?0x765f36:0x3c4148));m.position.set(or.x+x+.5,l.z-(l.thickness||.08)/2,or.y+y+.5);r.add(m)}if(q==='#'){const m=new THREE.Mesh(new THREE.BoxGeometry(1,3,1),M(0x555b64));m.position.set(or.x+x+.5,l.z+1.5,or.y+y+.5);r.add(m)}}for(const o of c.objects){if(o.type==='asset'){ps.push(addModel(o,or));continue}if(o.type==='light'){const l=new THREE.PointLight(0xffdda0,(o.intensity||1)*15,o.radius||5,2);l.position.set(or.x+o.x,o.z,or.y+o.y);r.add(l);continue}const w=o.w||.6,d=o.d||.6,h=o.h||.6,m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(o.type==='door'?0x467789:o.type==='hazard'?0x8f4f44:0x657569));m.position.set(or.x+o.x,o.z+h/2,or.y+o.y);m.rotation.y=-(o.rotation||0);r.add(m)}}await Promise.allSettled(ps);$('#o3').textContent='3D • '+S.p.chunks.length+' CHUNKS'}
async function previewModel(a){init3d();const p=S.three.preview;while(p.children.length)p.remove(p.children[0]);try{const m=await loadModel(a),b=new THREE.Box3().setFromObject(m),sz=new THREE.Vector3(),ce=new THREE.Vector3();b.getSize(sz);b.getCenter(ce);m.position.sub(ce);m.scale.setScalar(4/Math.max(sz.x,sz.y,sz.z,.001));m.position.set(12,2,12);p.add(m);S.three.ctl.target.set(12,2,12);S.three.cam.position.set(18,6,18);stat('Previewing '+a.name+'.','ok')}catch(e){stat('Model preview failed: '+e.message,'bad')}}
function mode(x){$('#v2').classList.toggle('hidden',x!=='2d');$('#v3').classList.toggle('hidden',x!=='3d');$('#b2').classList.toggle('active',x==='2d');$('#b3').classList.toggle('active',x==='3d');if(x==='3d'){init3d();resize();build3d()}else resize()}
$('#b2').onclick=()=>mode('2d');$('#b3').onclick=()=>mode('3d');window.onresize=resize;reset();assets();requestAnimationFrame(resize);
</script></body></html>
